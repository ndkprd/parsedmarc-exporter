# Deployment and Service for parsedmarc-exporter.
# The image is published at registry.gitlab.com/endekasoft/parsedmarc-exporter; pin a version
# tag instead of `latest` for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parsedmarc-exporter
  labels:
    app.kubernetes.io/name: parsedmarc-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parsedmarc-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parsedmarc-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: registry.gitlab.com/endekasoft/parsedmarc-exporter:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9190
          env:
            - name: PARSEDMARC_EXPORTER_DB_HOST
              value: postgres.parsedmarc.svc.cluster.local
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: parsedmarc-db, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: parsedmarc-db, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: parsedmarc-db, key: POSTGRES_DB}}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: parsedmarc-exporter
  labels:
    app.kubernetes.io/name: parsedmarc-exporter
spec:
  selector:
    app.kubernetes.io/name: parsedmarc-exporter
  ports:
    - name: http
      port: 9190
      targetPort: http
