# Minimal parsedmarc + PostgreSQL + parsedmarc-exporter stack.
#
#   cp .env.example .env     # then edit the IMAP settings and passwords
#   docker compose up -d            # pulls the published exporter image
#   docker compose up -d --build    # or build the exporter from this checkout
#   curl http://127.0.0.1:9190/metrics
#
# parsedmarc reads DMARC reports from an IMAP mailbox and writes them to PostgreSQL;
# the exporter reads PostgreSQL (read-only) and serves Prometheus metrics.
services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 4

  parsedmarc:
    image: ghcr.io/domainaware/parsedmarc:11.0.3
    restart: unless-stopped
    environment:
      PARSEDMARC_IMAP_HOST: ${IMAP_HOST}
      PARSEDMARC_IMAP_PORT: ${IMAP_PORT:-993}
      PARSEDMARC_IMAP_SSL: ${IMAP_SSL:-True}
      PARSEDMARC_IMAP_USER: ${IMAP_USER}
      PARSEDMARC_IMAP_PASSWORD: ${IMAP_PASSWORD}
      PARSEDMARC_MAILBOX_WATCH: "True"
      PARSEDMARC_POSTGRESQL_HOST: postgres
      PARSEDMARC_POSTGRESQL_PORT: "5432"
      PARSEDMARC_POSTGRESQL_USER: ${POSTGRES_USER}
      PARSEDMARC_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      PARSEDMARC_POSTGRESQL_DATABASE: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  exporter:
    build:
      context: ../..
    image: registry.gitlab.com/endekasoft/parsedmarc-exporter:latest
    restart: unless-stopped
    environment:
      PARSEDMARC_EXPORTER_DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${PARSEDMARC_EXPORTER_PORT:-9190}:9190"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/exporter", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
